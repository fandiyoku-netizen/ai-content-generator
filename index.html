<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Generator Command Center</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
    label { font-size: 0.9rem; color: #94a3b8; display: block; margin-top: 12px; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 18px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .output { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 6px; border-left: 4px solid #38bdf8; min-height: 80px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 AI Command Center</h1>
    
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key Kamu...">

    <label for="modelSelect">Pilih Model Gemini:</label>
    <select id="modelSelect">
      <option value="gemini-2.5-flash">gemini-2.5-flash (Rekomendasi Utama)</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="gemini-1.5-flash">gemini-1.5-flash</option>
    </select>

    <label for="prompt">Prompt / Pesan:</label>
    <textarea id="prompt" rows="4" placeholder="Tulis instruksi pesan di sini..."></textarea>

    <button onclick="generateContent()">Kirim Prompt</button>

    <label>Hasil Respons AI:</label>
    <div id="result" class="output">Hasil dari Gemini AI akan muncul di sini...</div>
  </div>

  <script>
    async function generateContent() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const selectedModel = document.getElementById('modelSelect').value;
      const prompt = document.getElementById('prompt').value.trim();
      const resultDiv = document.getElementById('result');

      if (!apiKey) { alert('Masukkan Gemini API Key!'); return; }
      if (!prompt) { alert('Prompt tidak boleh kosong!'); return; }

      resultDiv.innerText = 'Sedang memproses... ⏳';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultDiv.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          resultDiv.innerText = 'Error: ' + data.error.message;
        } else {
          resultDiv.innerText = 'Tidak ada respon dari AI.';
        }
      } catch (err) {
        resultDiv.innerText = 'Kesalahan koneksi: ' + err.message;
      }
    }
  </script>
</body>
</html>
