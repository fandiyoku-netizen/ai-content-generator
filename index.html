<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Generator Command Center | Fandy Yoku</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12 flex justify-center">

  <div class="container max-w-5xl bg-slate-900 p-8 md:p-10 rounded-3xl shadow-2xl border border-slate-800">
    <header class="text-center mb-10 flex flex-col items-center">
      <div class="text-6xl mb-4">🚀</div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-sky-400">AI Command Center</h1>
      <p class="text-sm md:text-base text-slate-400 mt-2">Dapatkan ide konten dengan cepat menggunakan Google Gemini API</p>
    </header>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Panel Input -->
      <div class="space-y-6">
        <div>
          <div class="flex justify-between items-center">
            <label for="apiKey" class="block text-sm font-medium text-slate-300">Gemini API Key:</label>
            <span id="savedBadge" class="text-xs text-emerald-400 hidden font-semibold">✓ Tersimpan Otomatis</span>
          </div>
          <input type="password" id="apiKey" placeholder="Masukkan API Key Gemini Kamu..." 
            class="w-full mt-2 p-4 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 placeholder:text-slate-600 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition duration-150">
          <p class="text-xs text-slate-500 mt-1">API Key tersimpan otomatis di browser kamu, tidak perlu diisi ulang.</p>
        </div>

        <div>
          <label for="modelSelect" class="block text-sm font-medium text-slate-300">Pilih Model Gemini:</label>
          <select id="modelSelect" class="w-full mt-2 p-4 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition duration-150 cursor-pointer">
            <option value="gemini-1.5-flash">gemini-1.5-flash (Cepat & Hemat)</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro (Lebih Cerdas)</option>
          </select>
        </div>

        <div>
          <label for="prompt" class="block text-sm font-medium text-slate-300">Prompt / Pesan:</label>
          <textarea id="prompt" rows="5" placeholder="Tulis instruksi konten di sini..." 
            class="w-full mt-2 p-4 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 placeholder:text-slate-600 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition duration-150 resize-none"></textarea>
        </div>

        <button onclick="generateContent()" class="w-full p-4 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-bold text-lg cursor-pointer transition duration-150 flex items-center justify-center space-x-2">
          <span id="buttonText">Kirim Prompt</span>
          <span id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></span>
        </button>
      </div>

      <!-- Panel Hasil -->
      <div class="border-l border-slate-800 pl-0 md:pl-8 mt-8 md:mt-0 flex flex-col">
        <label class="block text-sm font-medium text-slate-300 mb-2">Hasil Respons AI:</label>
        <div id="result" class="flex-grow p-6 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 min-h-[300px] whitespace-pre-wrap text-base font-normal leading-relaxed custom-scrollbar overflow-y-auto">Hasil dari Gemini AI akan muncul di sini...</div>
      </div>
    </div>
  </div>

  <script>
    // --- OPTIONAL: JIKA INGIN HARDCODE API KEY SECARA PERMANEN ---
    // Masukkan API Key kamu di antara tanda petik di bawah ini jika ingin langsung tertanam:
    const HARDCODED_API_KEY = ""; 

    // Muat API Key otomatis dari penyimpanan lokal saat halaman dibuka
    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("gemini_api_key") || HARDCODED_API_KEY;
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
        document.getElementById("savedBadge").classList.remove("hidden");
      }
    });

    // Simpan otomatis setiap kali pengguna mengetik di kolom API Key
    document.getElementById("apiKey").addEventListener("input", (e) => {
      const key = e.target.value.trim();
      if (key) {
        localStorage.setItem("gemini_api_key", key);
        document.getElementById("savedBadge").classList.remove("hidden");
      } else {
        localStorage.removeItem("gemini_api_key");
        document.getElementById("savedBadge").classList.add("hidden");
      }
    });

    async function generateContent() {
      const apiKeyInput = document.getElementById('apiKey').value.trim();
      const apiKey = apiKeyInput || HARDCODED_API_KEY;
      const selectedModel = document.getElementById('modelSelect').value;
      const prompt = document.getElementById('prompt').value.trim();
      const resultDiv = document.getElementById('result');
      const buttonText = document.getElementById('buttonText');
      const loader = document.getElementById('loader');

      if (!apiKey) { alert('Silakan masukkan Gemini API Key terlebih dahulu!'); return; }
      if (!prompt) { alert('Prompt tidak boleh kosong!'); return; }

      // Simpan ke localStorage
      localStorage.setItem("gemini_api_key", apiKey);

      resultDiv.innerText = 'Sedang memproses... ⏳';
      resultDiv.classList.remove('text-red-400');
      buttonText.classList.add('hidden');
      loader.classList.remove('hidden');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        
        buttonText.classList.remove('hidden');
        loader.classList.add('hidden');

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultDiv.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          resultDiv.classList.add('text-red-400');
          resultDiv.innerText = 'Error API: ' + data.error.message;
        } else {
          resultDiv.classList.add('text-red-400');
          resultDiv.innerText = 'Tidak ada respons dari AI.';
        }
      } catch (err) {
        buttonText.classList.remove('hidden');
        loader.classList.add('hidden');
        resultDiv.classList.add('text-red-400');
        resultDiv.innerText = 'Terjadi kesalahan koneksi: ' + err.message;
      }
    }
  </script>
</body>
</html>
